openapi: 3.0.3
info:
  title: Academy CRM API
  version: 1.0.0
  description: REST API for Academy CRM Backend
paths:
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        Custom schema view that handles errors gracefully.
        Works even if database is not available.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      tags:
      - api
      security:
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /admissions/applications/:
    get:
      operationId: admissions_applications_list
      description: ViewSet for Application model.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: program
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          x-spec-enum-id: 7b2ccf12de8df1d9
          enum:
          - ACCEPTED
          - IN_REVIEW
          - NEW
          - REJECTED
        description: |-
          * `NEW` - New
          * `IN_REVIEW` - In Review
          * `ACCEPTED` - Accepted
          * `REJECTED` - Rejected
      tags:
      - admissions
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationList'
          description: ''
    post:
      operationId: admissions_applications_create
      description: ViewSet for Application model.
      tags:
      - admissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
