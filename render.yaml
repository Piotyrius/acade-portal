# Render Static Site Configuration
# This file configures the static site deployment on Render

services:
  - type: web
    name: acade-portal
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    # Render will automatically handle SPA routing with _redirects file
    # If _redirects doesn't work, configure redirects in Render dashboard:
    # Settings > Redirects/Rewrites > Add redirect: /* -> /index.html (200)

